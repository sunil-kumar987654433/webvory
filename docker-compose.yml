version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: webvory-postgres-cont
    # environment:
    #   - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    #   - POSTGRES_USER=${POSTGRES_USER}
    #   - POSTGRES_DB=${POSTGRES_DB}
    env_file:
      - .env
    restart: always
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: webvory-web-img
    container_name: webvory-web-cont
    command: sh -c "uvicorn src:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - ./:/usr/src/app
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped
    networks:
      - app-network




  redis:
    image: redis:7-alpine
    networks:
      - app-network
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - redis_data:/data
    

  migrate:
    build:
      context: .
    command: alembic upgrade head
    environment:
      - name=value
    env_file:
      - .env
    networks:
      - app-network
    restart: "no"

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
  redis_data: